<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawStore - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Iniciar sesión</h2>

            <!--  Mensaje de error (oculto por defecto) -->
            <p id="error-msg" class="error-msg" style="display: none;">
                Credenciales incorrectas. Inténtalo de nuevo.
            </p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="nombre.apellido@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>

            <div class="auth-links">
                <a href="registro.html">¿No tienes cuenta? Regístrate aquí</a>
                <br>
                <a href="index.html">Volver al inicio</a>
            </div>
        </div>
    </main>

    <!--  Header, Modal y Footer dinámicos -->
    <script type="module">
        import { renderLayout } from './js/layout.js';
        renderLayout();
    </script>
    <!--  Lógica de autenticación -->
    <script type="module" src="js/login.js"></script>
</body>

</html>
