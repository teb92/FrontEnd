<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawStore - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Iniciar sesión</h1>

            <form id="login-form" method="post">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="nombre.apellido@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>

            <div class="auth-links">
                <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
                <br>
                <a href="register.html">¿No tienes cuenta? Regístrate aquí</a>
                <br>
                <a href="index.html">Volver al inicio</a>
            </div>
        </div>
    </main>

    <!-- Header and footer are injected by js/login.js (through js/layout.js) -->
    <script type="module" src="js/login.js"></script>
</body>

</html>
