<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawStore - Recuperar contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Header and footer are injected by js/layout.js. The two steps are handled by js/forgot-password.js -->
    <main class="auth-container">
        <div class="auth-card">

            <!-- Step 1: ask for the verification code -->
            <section id="step-email" aria-labelledby="forgot-title">
                <h1 id="forgot-title">¿Olvidaste tu contraseña?</h1>
                <p class="auth-intro">Ingresa tu correo y te enviaremos un código de verificación para crear una nueva
                    contraseña.</p>

                <form id="email-form" method="post" novalidate>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="nombre.apellido@ejemplo.com" autocomplete="email">
                    </div>

                    <button type="submit" class="btn-primary">Enviar código</button>
                </form>

                <div class="auth-links">
                    <button type="button" id="have-code-btn" class="link-button">Ya tengo un código</button>
                    <br>
                    <a href="login.html">Volver a iniciar sesión</a>
                </div>
            </section>

            <!-- Step 2: enter the code and choose the new password -->
            <section id="step-reset" aria-labelledby="reset-title" hidden>
                <h1 id="reset-title">Restablecer contraseña</h1>
                <p class="auth-intro">Escribe el código de 6 dígitos que te enviamos y elige tu nueva contraseña.</p>

                <form id="reset-form" method="post" novalidate>
                    <div class="form-group">
                        <label for="reset-email">Correo electrónico</label>
                        <input type="email" id="reset-email" placeholder="nombre.apellido@ejemplo.com"
                            autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="code">Código de verificación</label>
                        <input type="text" id="code" placeholder="123456" maxlength="6">
                    </div>

                    <div class="form-group">
                        <label for="new-password">Nueva contraseña</label>
                        <input type="password" id="new-password" placeholder="••••••••••••" autocomplete="new-password">
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirmar contraseña</label>
                        <input type="password" id="confirm-password" placeholder="••••••••••••"
                            autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn-primary">Cambiar contraseña</button>
                </form>

                <div class="auth-links">
                    <button type="button" id="resend-btn" class="link-button">Reenviar código</button>
                    <br>
                    <button type="button" id="change-email-btn" class="link-button">Usar otro correo</button>
                    <br>
                    <a href="login.html">Volver a iniciar sesión</a>
                </div>
            </section>

        </div>
    </main>

    <script type="module" src="js/forgot-password.js"></script>
</body>

</html>
