<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Compra Exitosa! - PawStore</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="success-container">
        <div class="success-icon">✓</div>
        <h1>¡Pedido Realizado con Éxito!</h1>
        <p class="subtitle">Tu orden ha sido procesada correctamente y el inventario ha sido actualizado. En breve
            enviaremos los detalles a tu correo.</p>

        <div class="order-details-box">
            <h3>Resumen del Pedido</h3>
            <div id="customer-details" class="customer-info"></div>

            <table class="order-table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cant.</th>
                        <th>Precio Unit.</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="order-items-container">
                    <!-- Filled by js/order-completed.js -->
                </tbody>
            </table>

            <div class="total-row" id="order-total-display">
                Total: ₡0
            </div>
        </div>

        <div class="actions">
            <a href="products.html" class="btn btn-primary">Volver al Catálogo</a>
            <a href="index.html" class="btn btn-secondary">Ir al Inicio</a>
        </div>
    </main>

    <script type="module" src="js/order-completed.js"></script>
</body>

</html>
