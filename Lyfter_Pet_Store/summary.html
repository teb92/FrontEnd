<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Compra - Lyfter Pet Store</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Order processing screen (hidden by default) -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <h2>Procesando tu pago con el banco...</h2>
        <p>Por favor, no cierres esta ventana.</p>
    </div>

    <main class="checkout-page">
        <h1>Resumen de tu Pedido 🐾</h1>

        <div class="summary-grid">

            <!-- Product list -->
            <div>
                <h2>Tus Productos</h2>
                <div id="order-items-list" class="order-items-list"></div>
                <div class="order-total">
                    Total a Pagar: <span id="order-total">₡0</span>
                </div>
            </div>

            <!-- Shipping and payment form -->
            <div>
                <h2>Datos de Envío y Pago</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="fullName">Nombre Completo</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Dirección de Entrega</label>
                        <input type="text" id="address" placeholder="Ej: San José, Costa Rica" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Teléfono</label>
                        <input type="text" id="phone" placeholder="Ej: 8888-8888" required>
                    </div>

                    <!-- Fake card details -->
                    <div class="payment-section">
                        <h3>Información de Tarjeta (Ficticia)</h3>
                        <div class="form-group">
                            <label for="cardNumber">Número de Tarjeta</label>
                            <input type="text" id="cardNumber" placeholder="4000 1234 5678 9010" maxlength="19"
                                required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cardExpiry">Expiración</label>
                                <input type="text" id="cardExpiry" placeholder="MM/AA" maxlength="5" required>
                            </div>
                            <div class="form-group">
                                <label for="cardCvv">CVV</label>
                                <input type="password" id="cardCvv" placeholder="123" maxlength="4" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-pay">
                        Pagar y Finalizar Compra
                    </button>
                </form>
            </div>

        </div>
    </main>

    <script type="module" src="js/summary.js"></script>
</body>

</html>
