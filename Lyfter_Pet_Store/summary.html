<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary - PawStore</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">🐾 PawStore</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="main-container">
        <h2>Order Summary</h2>

        <div class="checkout-grid">
            <!-- Left Column: Shipping Form -->
            <section class="card">
                <h3>Shipping Information</h3>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" required placeholder="e.g. Jane Doe">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="jane.doe@example.com">
                    </div>
                    <div class="form-group">
                        <label for="address">Shipping Address</label>
                        <input type="text" id="address" required placeholder="123 Main Street, City">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" required placeholder="+1 555-123-4567">
                    </div>
                    <small class="help-text">This information will be used to coordinate delivery.</small>
                </form>
            </section>

            <!-- Right Column: Order Breakdown -->
            <section class="card">
                <h3>Order Summary</h3>
                <div id="order-items-list" class="items-list">
                    <!-- Dynamically populated via JS -->
                </div>
                <hr>
                <div class="total-row">
                    <span>Total:</span>
                    <strong id="order-total">₡0</strong>
                </div>
                <button type="submit" form="checkout-form" class="btn-primary full-width">Confirm Purchase</button>
                <a href="cart.html" class="btn-link">Cancel</a>
            </section>
        </div>
    </main>

    <script type="module" src="js/summary.js"></script>
</body>

</html>
