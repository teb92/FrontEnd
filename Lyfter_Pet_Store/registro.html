<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawStore - Crear cuenta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Crear cuenta</h2>

            <!--  Mensaje de error dinámico -->
            <p id="error-msg" class="error-msg" style="display: none;"></p>

            <form id="register-form">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Introduce tu nombre completo" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@dominio.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Introduce tu contraseña" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" placeholder="Confirma tu contraseña" required>
                </div>

                <button type="submit" class="btn-primary">Registrarse</button>
            </form>

            <div class="auth-links">
                <a href="login.html">Ya tengo una cuenta</a>
            </div>
        </div>
    </main>

    <!--  Header y Footer dinámicos -->
    <script type="module">
        import { renderLayout } from './js/layout.js';
        renderLayout();
    </script>
    <!-- Lógica de registro -->
    <script type="module" src="js/registro.js"></script>
</body>

</html>
