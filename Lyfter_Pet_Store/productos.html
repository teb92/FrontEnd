<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawStore - Productos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Contenido principal del Catálogo -->
  <main class="catalog-container">
    <!-- 🔍 Barra de Búsqueda y Filtros -->
    <section class="filters-section">
      <input type="search" id="search-input" placeholder="🔍 Buscar producto...">
      <label>
        <input type="checkbox" id="filter-available"> Mostrar solo disponibles
      </label>
    </section>

    <!-- Contador de resultados -->
    <p id="results-count" class="results-count"></p>

    <!--  Rejilla de Productos -->
    <section class="product-grid" id="product-grid"></section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>

</html>
