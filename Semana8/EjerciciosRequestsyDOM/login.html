<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Login</title>
</head>

<body>
  <h1>Login</h1>

  <input id="id" placeholder="User ID" /><br />
  <input id="password" type="password" placeholder="Password" /><br />
  <button onclick="login()">Sign In</button>

  <p>Don't have an account? <a href="registro.html">Register here</a></p>

  <p id="error" style="color: red; display: none;"></p>

  <script>
    // If there is already an active session, go straight to the profile
    if (localStorage.getItem("user")) {
      window.location.href = "perfil.html";
    }

    async function login() {
      const id = document.getElementById("id").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorEl = document.getElementById("error");

      errorEl.style.display = "none";

      if (!id || !password) {
        errorEl.textContent = "Please fill in all fields.";
        errorEl.style.display = "block";
        return;
      }

      try {
        // Exercise 3: GET to look up the user by ID
        const response = await fetch(`https://api.restful-api.dev/objects/${id}`);

        // If the ID doesn't exist the API returns 404
        if (response.status === 404) {
          errorEl.textContent = "User not found. Please check your ID.";
          errorEl.style.display = "block";
          return;
        }

        if (!response.ok) throw new Error("Server error.");

        const user = await response.json();

        // Verify that the password matches the one stored in the API
        if (user.data?.password !== password) {
          errorEl.textContent = "Incorrect password.";
          errorEl.style.display = "block";
          return;
        }

        // Login successful: save session in localStorage and redirect
        localStorage.setItem("user", JSON.stringify(user));
        window.location.href = "perfil.html";

      } catch (error) {
        errorEl.textContent = "An error occurred while signing in. Please try again.";
        errorEl.style.display = "block";
      }
    }
  </script>
  <script src="nav.js"></script>
</body>

</html>
